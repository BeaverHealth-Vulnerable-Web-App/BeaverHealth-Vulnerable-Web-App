name: BeaverHealth Building and Testing

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Run Composer Install
        run: composer install -n --prefer-dist

      - name: Run Laravel Application
        run: vendor/bin/sail up -d --build

      - name: Wait for Database
        run: |
          MAX_DATABASE_CONNECTION_ATTEMPTS=30
          attempt=1
          while ! ./vendor/bin/sail exec db mysqladmin ping --silent; do
            echo -e "Attempt $attempt: Database not ready, waiting 2 seconds..."
            sleep 2
            attempt=$((attempt + 1))
            if [[ "$attempt" -gt "$MAX_DATABASE_CONNECTION_ATTEMPTS" ]]; then
              echo -e "Database did not become available after $MAX_DATABASE_CONNECTION_ATTEMPTS attempts."
              exit 1
            fi
          done

      - name: Docker ps
        run: docker ps

      - name: Migrate Database
        run: vendor/bin/sail artisan migrate

      - name: Seed Database
        run: vendor/bin/sail artisan db:seed

      - name: Run PHPUnit Tests
        run: vendor/bin/sail test
