name: BeaverHealth CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2
        with:
          php-version: '8.2'
          extensions: ctype, dom, fileinfo, filter, hash, json, libxml, mbstring, openssl, pcre, phar, reflection, session, simplexml, tokenizer, xml, xmlwriter, lib-pcre, artisan
          coverage: none

      - name: Run Composer Install
        run: composer install -n --prefer-dist

      - name: Start Laravel Application
        run: vendor/bin/sail up -d --build

      - name: Wait for Database
        run: |
          counter=0
          until ./vendor/bin/sail exec db mysqladmin ping --silent; do
            echo "Waiting for database..."
            sleep 2
            counter=$((counter+1))
            if [ $counter -gt 30 ]; then
              echo "Database did not become ready in time."
              exit 1
            fi
          done

      - name: Run Laravel Tests
        run: ./vendor/bin/sail test
