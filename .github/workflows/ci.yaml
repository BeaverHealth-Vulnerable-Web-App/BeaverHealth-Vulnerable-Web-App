name: BeaverHealth CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2

      - name: Run Composer Install
        run: composer install -n --prefer-dist

      - name: Start Laravel Application
        run: vendor/bin/sail up -d --build
        env:
          DB_CONNECTION: mysql
          DB_HOST: db
          DB_PORT: 3306
          DB_DATABASE: vuln_db
          DB_USERNAME: admin
          DB_PASSWORD: password

      - name: Wait for Database
        run: |
          counter=0
          until ./vendor/bin/sail exec db mysqladmin ping --silent; do
            echo "Waiting for database..."
            sleep 2
            counter=$((counter+1))
            if [ $counter -gt 30 ]; then
              echo "Database did not become ready in time."
              exit 1
            fi
          done

      - name: Set Permissions
        run: |
          sudo chmod -R 777 storage bootstrap/cache

      - name: Test Database Connection
        run: |
          ./vendor/bin/sail exec app php -r "
          try {
            new PDO('mysql:host=db;port=3306;dbname=vuln_db', 'admin', 'password');
            echo 'Database connection successful!';
          } catch (Exception \$e) {
            echo 'Failed to connect to database: ' . \$e->getMessage();
            exit(1);
          }"

      - name: Run Laravel Tests
        run: ./vendor/bin/sail exec app php artisan test
