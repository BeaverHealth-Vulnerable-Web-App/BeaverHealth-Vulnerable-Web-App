name: BeaverHealth Building and Testing

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2
        with:
          php-version: '8.2'
          extensions: ctype, dom, fileinfo, filter, hash, json, libxml, mbstring, openssl, pcre, phar, reflection, session, simplexml, tokenizer, xml, xmlwriter, lib-pcre, artisan
          coverage: none

      - name: Run Composer Install
        run: composer install -n --prefer-dist

      - name: Run Laravel Application
        run: vendor/bin/sail up -d --build

      - name: Migrate Database
        run: vendor/bin/sail artisan migrate

      - name: Seed Database
        run: vendor/bin/sail artisan db:seed

      - name: Run PHPUnit Tests
        run: vendor/bin/sail test
