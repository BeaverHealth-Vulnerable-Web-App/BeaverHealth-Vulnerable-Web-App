services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UPLOAD_LIMIT: ${UPLOAD_LIMIT}
    ports:
      - "${APP_PORT:-9991}:80"
    env_file:
      - .env
    depends_on:
      - db

  db:
    platform: linux/x86_64
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    ports:
      - "${DB_PORT:-3306}:3306"
